[versions]
codeScanner = "16.1.0"
agp = "9.4.0"
kotlin = "2.4.20"
coroutines = "1.11.0"
coreKtx = "1.19.1"
appcompat = "1.8.0"
activity = "1.13.0"
lifecycle = "2.11.0"
constraintlayout = "2.2.2"
material = "1.14.0"
composeBom = "2026.09.00"
yandexAds = "8.5.0"
appMetrica = "8.6.0"
aboutLibraries = "15.2.0"
billing = "9.1.0"
playReview = "2.0.2"
junit = "4.13.2"
ktlint = "1.8.0"
detekt = "1.23.8"
composeRules = "0.6.7"

[libraries]
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "codeScanner" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
material = { module = "com.google.android.material:material", version.ref = "material" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
yandex-ads = { module = "com.yandex.android:mobileads", version.ref = "yandexAds" }
appmetrica = { module = "io.appmetrica.analytics:analytics", version.ref = "appMetrica" }
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutLibraries" }
aboutlibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutLibraries" }
billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
play-review = { module = "com.google.android.play:review", version.ref = "playReview" }
junit = { module = "junit:junit", version.ref = "junit" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
compose-rules-ktlint = { module = "io.nlopez.compose.rules:ktlint", version.ref = "composeRules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Not applied (AGP 9 has built-in Kotlin), only sets the Kotlin Gradle plugin version
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Collects licenses of all dependencies into the app (third-party software screen)
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutLibraries" }
