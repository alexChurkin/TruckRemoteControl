plugins {
    id 'com.android.application'
}

//Real AdMob ids are kept out of the repository; test ids are used without the file
def props = new Properties()
def adPropertiesFile = file("ad.properties")
if (adPropertiesFile.exists()) {
    adPropertiesFile.withInputStream { props.load(it) }
}
props.putIfAbsent("admobAppId", "ca-app-pub-3940256099942544~3347511713")
props.putIfAbsent("interstitialAdId", "ca-app-pub-3940256099942544/1033173712")

android {
    namespace 'com.alexchurkin.truckremote'
    compileSdk 37

    defaultConfig {
        applicationId "com.alexchurkin.truckremote"
        minSdk 23
        targetSdk 37
        versionCode 34
        versionName "1.22"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField('String', 'ADMOB_APP_ID', "\"" + props.getProperty("admobAppId") + "\"")
        manifestPlaceholders = [admobAppId: props.getProperty("admobAppId")]

        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'

        vectorDrawables.useSupportLibrary = true
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix '.debug'
            versionNameSuffix ' (debug)'
            buildConfigField('String', 'INTERSTITIAL_AD_ID', "\"ca-app-pub-3940256099942544/1033173712\"")
            buildConfigField "boolean", "USE_LOG", "true"
        }
        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField('String', 'INTERSTITIAL_AD_ID', "\"" + props.getProperty("interstitialAdId") + "\"")
            buildConfigField "boolean", "USE_LOG", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.android.billingclient:billing:9.1.0'
}
